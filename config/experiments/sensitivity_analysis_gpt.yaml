seed: 42
output_root: /scratch.global/chen8596/sensitivity_analysis_gpt

launch:
  mode: torchrun
  nproc_per_node: 4

defaults:
  train_config: config/train_gpt2.py
  num_trials: 5
  fixed_overrides:
    max_iters: 5000
    lr_decay_iters: 5000

sweeps:
  - name: linesearch_adam_c1
    train_script: train_linesearch.py
    sweep_param: linesearch_c1
    distribution: log_uniform
    range: [1.0e-3, 0.5]
    extra_overrides:
      decay_lr: true
      learning_rate: 6.0e-4

  - name: linesearch_muon_c1
    train_script: train_linesearch_muon.py
    sweep_param: linesearch_c1
    distribution: uniform
    range: [5.0e-2, 1.0]
    extra_overrides:
      decay_lr: true
      muon_lr: 0.05
