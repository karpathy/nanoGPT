experiment:
  name: llama1b_schedulefree_adam_lr_search
  train_script: train_llama.py
  train_config: config/train_llama_1b.py
  output_root: /scratch.global/chen8596/experiment_runs
  target_family: LLaMA
  target_dataset: C4
  target_model_size: 1B
  skip_table_validation: true

launch:
  mode: torchrun
  nproc_per_node: 4

fixed_args:
  dataset: c4
  dataset_config_name: en
  tokenizer_name: t5-base
  compile: true
  optimizer_type: AdamWScheduleFree
  eval_interval: 200
  eval_iters: 20
  log_interval: 10
  always_save_checkpoint: true
  max_iters: 305176
  lr_decay_iters: 305176

hyperparameters:
  learning_rate:
    type: log_uniform
    range: [1.0e-5, 1.0e-1]

task:
  train_metric: train_loss
  test_metric: val_loss
  metric_mode: min
  num_iterations_per_trial: 305176
  max_running_time_per_trial_hours: 0.0

optuna:
  max_study_time_hours: 120.0
  pruning:
    enabled: true
    type: median
    n_startup_trials: 1
    n_warmup_steps: 1
    interval_steps: 1

checkpoint:
  save_last: true
